<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#6c5ce7">
<title>待办事项</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;background:#f0f2f5;color:#333;min-height:100vh;-webkit-tap-highlight-color:transparent}
.container{max-width:720px;margin:0 auto;padding:24px 16px}
header{text-align:center;margin-bottom:20px}
header h1{font-size:26px;font-weight:700;color:#1a1a2e}
header p{color:#888;font-size:13px;margin-top:4px}

/* 统计 */
.stats-bar{display:flex;gap:10px;margin-bottom:16px}
.stat-card{flex:1;background:#fff;border-radius:12px;padding:14px 8px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.stat-card .num{font-size:26px;font-weight:700}
.stat-card .label{font-size:11px;color:#888;margin-top:2px}
.stat-card.pending .num{color:#e17055}
.stat-card.done .num{color:#00b894}
.stat-card.overdue .num{color:#d63031}
.stat-card.rate .num{color:#6c5ce7}

/* 添加表单 */
.add-form{background:#fff;border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.add-form .form-row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.add-form input[type="text"],.add-form input[type="date"]{padding:10px 12px;border:1px solid #e0e0e0;border-radius:8px;font-size:14px;outline:none;transition:border .2s;background:#fafafa}
.add-form input:focus{border-color:#6c5ce7;background:#fff}
.add-form .text-input{flex:1;min-width:200px}
.add-form select{padding:10px 12px;border:1px solid #e0e0e0;border-radius:8px;font-size:14px;outline:none;background:#fafafa}
.add-form select:focus{border-color:#6c5ce7}
.add-form .tags-input{width:120px}

/* 工具栏 */
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.toolbar input,.toolbar select{padding:8px 12px;border:1px solid #e0e0e0;border-radius:8px;font-size:13px;outline:none;background:#fff}
.toolbar input:focus,.toolbar select:focus{border-color:#6c5ce7}
.search-input{flex:1;min-width:140px}
.btn{padding:8px 14px;border:none;border-radius:8px;font-size:13px;cursor:pointer;transition:all .15s;font-weight:500;-webkit-user-select:none;user-select:none}
.btn:active{transform:scale(.96)}
.btn-primary{background:#6c5ce7;color:#fff}
.btn-primary:hover{background:#5a4bd1}
.btn-danger{background:#ff7675;color:#fff}
.btn-danger:hover{background:#e66}
.btn-ghost{background:transparent;color:#6c5ce7;border:1px solid #6c5ce7}
.btn-ghost:hover{background:#6c5ce7;color:#fff}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px}

/* 待办列表 */
.todo-list{display:flex;flex-direction:column;gap:8px}
.todo-item{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);display:flex;align-items:flex-start;gap:10px;transition:all .15s}
.todo-item:active{background:#f8f8f8}
.todo-item.done{opacity:.6}
.todo-item.done .todo-text{text-decoration:line-through;color:#999}

.checkbox{width:22px;height:22px;border-radius:6px;border:2px solid #d0d0d0;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;margin-top:1px}
.checkbox:active{transform:scale(.9)}
.checkbox.checked{background:#00b894;border-color:#00b894}
.checkbox.checked::after{content:"✓";color:#fff;font-size:13px;font-weight:700}

.todo-body{flex:1;min-width:0}
.todo-text{font-size:15px;word-break:break-word;line-height:1.4}
.todo-meta{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap;align-items:center}
.badge{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:600;white-space:nowrap}
.badge-high{background:#ffe0e0;color:#d63031}
.badge-medium{background:#fff3e0;color:#e17055}
.badge-low{background:#e8f5e9;color:#00b894}
.badge-due{background:#ede7f6;color:#6c5ce7}
.badge-overdue{background:#d63031;color:#fff}
.badge-tag{background:#e3f2fd;color:#0984e3}
.todo-time{font-size:10px;color:#bbb}

.todo-actions{display:flex;gap:4px;flex-shrink:0}

.empty-state{text-align:center;padding:40px 20px;color:#bbb}
.empty-state .icon{font-size:44px;margin-bottom:10px}

/* 编辑模态框 */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal-overlay.active{display:flex}
.modal{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:440px;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.modal h3{margin-bottom:14px;font-size:17px}
.modal .field{margin-bottom:10px}
.modal label{display:block;font-size:12px;color:#888;margin-bottom:3px}
.modal input,.modal select{width:100%;padding:9px 12px;border:1px solid #e0e0e0;border-radius:8px;font-size:14px;outline:none;background:#fafafa}
.modal input:focus,.modal select:focus{border-color:#6c5ce7;background:#fff}
.modal .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

/* toast */
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}

/* 数据管理栏 */
.data-bar{display:flex;gap:8px;margin-top:20px;justify-content:center;flex-wrap:wrap}
.data-bar .btn{font-size:11px;padding:5px 10px;background:#f0f0f0;color:#888;border:none}
.data-bar .btn:hover{background:#e0e0e0;color:#555}

/* 移动端适配 */
@media(max-width:600px){
  .container{padding:12px 8px}
  header h1{font-size:22px}
  .stats-bar{gap:6px}
  .stat-card{padding:10px 4px;border-radius:8px}
  .stat-card .num{font-size:20px}
  .stat-card .label{font-size:10px}
  .add-form{padding:12px}
  .add-form .form-row{gap:6px;flex-direction:column}
  .add-form input[type="text"],.add-form input[type="date"]{width:100%;font-size:16px}
  .add-form select{width:100%;font-size:16px}
  .add-form .text-input{min-width:0;width:100%}
  .add-form .tags-input{width:100%}
  .add-form .form-row:last-child{flex-direction:row;justify-content:flex-end}
  .toolbar{gap:6px}
  .toolbar input,.toolbar select{padding:6px 8px;font-size:13px}
  .search-input{min-width:0;flex-basis:100%}
  .btn{padding:7px 12px;font-size:13px}
  .todo-item{padding:12px;gap:8px;border-radius:10px}
  .todo-text{font-size:14px}
  .todo-meta{gap:4px}
  .badge{font-size:9px;padding:1px 5px}
  .todo-time{font-size:9px}
  .todo-actions{flex-direction:row;width:100%;justify-content:flex-end;gap:6px;margin-top:4px}
  .todo-actions .btn{padding:5px 10px;font-size:12px}
  .checkbox{width:20px;height:20px}
  .modal{padding:16px;width:95%}
  .modal h3{font-size:16px}
  .toast{top:10px;font-size:12px;padding:8px 16px}
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>📋 待办事项</h1>
    <p id="dateDisplay"></p>
  </header>

  <div class="stats-bar">
    <div class="stat-card pending"><div class="num" id="statPending">0</div><div class="label">待办</div></div>
    <div class="stat-card done"><div class="num" id="statDone">0</div><div class="label">完成</div></div>
    <div class="stat-card overdue"><div class="num" id="statOverdue">0</div><div class="label">逾期</div></div>
    <div class="stat-card rate"><div class="num" id="statRate">0%</div><div class="label">完成率</div></div>
  </div>

  <div class="add-form">
    <div class="form-row">
      <input type="text" id="addText" class="text-input" placeholder="输入待办内容，回车添加..." autofocus>
    </div>
    <div class="form-row">
      <select id="addPriority">
        <option value="medium">🟡 中优先级</option>
        <option value="high">🔴 高优先级</option>
        <option value="low">🟢 低优先级</option>
      </select>
      <input type="date" id="addDue" title="截止日期">
      <input type="text" id="addTags" class="tags-input" placeholder="标签(逗号分隔)">
    </div>
    <div class="form-row" style="justify-content:flex-end">
      <button class="btn btn-primary" onclick="addTodo()">添加</button>
    </div>
  </div>

  <div class="toolbar">
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 搜索..." oninput="render()">
    <select id="filterStatus" onchange="render()">
      <option value="all">全部</option>
      <option value="pending">待办</option>
      <option value="done">已完成</option>
    </select>
    <select id="sortBy" onchange="render()">
      <option value="priority">按优先级</option>
      <option value="due">按截止日期</option>
      <option value="created">按创建时间</option>
    </select>
    <button class="btn btn-danger btn-sm" onclick="clearDone()">🗑 清除已完成</button>
  </div>

  <div class="todo-list" id="todoList"></div>

  <div class="data-bar">
    <button class="btn" onclick="exportData()">📤 导出文件</button>
    <button class="btn" onclick="document.getElementById('importFile').click()">📥 导入文件</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
    <button class="btn" onclick="showSyncCode()">🔄 同步码</button>
  </div>
</div>

<!-- 编辑模态框 -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h3>✏️ 编辑待办</h3>
    <div class="field"><label>内容</label><input type="text" id="editText"></div>
    <div class="field"><label>优先级</label>
      <select id="editPriority">
        <option value="high">🔴 高</option>
        <option value="medium">🟡 中</option>
        <option value="low">🟢 低</option>
      </select>
    </div>
    <div class="field"><label>截止日期</label><input type="date" id="editDue"></div>
    <div class="field"><label>标签 (逗号分隔)</label><input type="text" id="editTags"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeEdit()">取消</button>
      <button class="btn btn-primary" onclick="saveEdit()">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- 同步码模态框 -->
<div class="modal-overlay" id="syncModal">
  <div class="modal">
    <h3>🔄 跨设备同步</h3>
    <p style="font-size:13px;color:#888;margin-bottom:12px">复制同步码到另一设备粘贴，即可同步数据</p>
    <div class="field">
      <label>📤 导出同步码（复制后发送到另一设备）</label>
      <textarea id="syncExport" readonly style="width:100%;height:80px;padding:8px;border:1px solid #e0e0e0;border-radius:8px;font-size:12px;font-family:monospace;resize:none;background:#fafafa"></textarea>
      <button class="btn btn-primary" style="margin-top:6px;width:100%" onclick="copySyncCode()">复制同步码</button>
    </div>
    <div style="text-align:center;color:#ccc;margin:8px 0">─── ─── ───</div>
    <div class="field">
      <label>📥 导入同步码（从另一设备复制粘贴）</label>
      <textarea id="syncImport" placeholder="粘贴同步码..." style="width:100%;height:80px;padding:8px;border:1px solid #e0e0e0;border-radius:8px;font-size:12px;font-family:monospace;resize:none;background:#fafafa"></textarea>
      <div style="display:flex;gap:6px;margin-top:6px">
        <button class="btn btn-primary" style="flex:1" onclick="importSyncCode('merge')">合并导入</button>
        <button class="btn btn-danger" style="flex:1" onclick="importSyncCode('replace')">替换导入</button>
      </div>
      <p style="font-size:11px;color:#aaa;margin-top:4px">合并=保留本地数据+添加新数据 | 替换=清空本地并用同步码数据覆盖</p>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeSync()">关闭</button>
    </div>
  </div>
</div>

<script>
// ─── 数据层（localStorage）─────────────────────────────────
const STORAGE_KEY = 'todo_app_data';
const PRIORITY_MAP = {'高':'high','中':'medium','低':'low','high':'high','medium':'medium','low':'low'};
const PRIORITY_ORDER = {high:0,medium:1,low:2};
const PRIORITY_LABEL = {high:'🔴 高',medium:'🟡 中',low:'🟢 低'};

function loadTodos() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch(e) { return []; }
}

function saveTodos(todos) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
}

function nextId(todos) {
  return todos.length ? Math.max(...todos.map(t=>t.id)) + 1 : 1;
}

// ─── 渲染 ──────────────────────────────────────────────────
let editingId = null;

document.getElementById('dateDisplay').textContent =
  new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});

document.getElementById('addText').addEventListener('keydown', e => { if(e.key==='Enter') addTodo(); });

function render() {
  const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
  const status = document.getElementById('filterStatus').value;
  const sort = document.getElementById('sortBy').value;

  let todos = loadTodos();
  if (status !== 'all') todos = todos.filter(t => t.status === status);
  if (keyword) todos = todos.filter(t => t.text.toLowerCase().includes(keyword));

  if (sort === 'priority') todos.sort((a,b) => (PRIORITY_ORDER[a.priority]||1) - (PRIORITY_ORDER[b.priority]||1) || a.id - b.id);
  else if (sort === 'due') todos.sort((a,b) => (a.due||'9999') < (b.due||'9999') ? -1 : 1);
  else if (sort === 'created') todos.sort((a,b) => b.created_at > a.created_at ? 1 : -1);

  const list = document.getElementById('todoList');
  if (!todos.length) {
    list.innerHTML = '<div class="empty-state"><div class="icon">🎉</div><div>暂无待办事项</div></div>';
  } else {
    const today = new Date().toISOString().slice(0,10);
    list.innerHTML = todos.map(t => {
      const isOverdue = t.status==='pending' && t.due && t.due < today;
      const pc = t.priority || 'medium';
      return `
      <div class="todo-item ${t.status==='done'?'done':''}" data-id="${t.id}">
        <div class="checkbox ${t.status==='done'?'checked':''}" onclick="toggleTodo(${t.id})"></div>
        <div class="todo-body">
          <div class="todo-text">${esc(t.text)}</div>
          <div class="todo-meta">
            <span class="badge badge-${pc}">${PRIORITY_LABEL[pc]||'🟡 中'}</span>
            ${t.due?`<span class="badge ${isOverdue?'badge-overdue':'badge-due'}">📅 ${t.due}${isOverdue?' 逾期':''}</span>`:''}
            ${(t.tags||[]).map(tag=>`<span class="badge badge-tag">#${esc(tag)}</span>`).join('')}
            <span class="todo-time">${t.status==='done'&&t.completed_at?'完成于 '+t.completed_at:t.created_at}</span>
          </div>
        </div>
        <div class="todo-actions">
          <button class="btn btn-ghost btn-sm" onclick="openEdit(${t.id})">编辑</button>
          <button class="btn btn-danger btn-sm" onclick="deleteTodo(${t.id})">删除</button>
        </div>
      </div>`;
    }).join('');
  }
  updateStats();
}

function updateStats() {
  const todos = loadTodos();
  const today = new Date().toISOString().slice(0,10);
  const total = todos.length;
  const pending = todos.filter(t=>t.status==='pending').length;
  const done = todos.filter(t=>t.status==='done').length;
  const overdue = todos.filter(t=>t.status==='pending'&&t.due&&t.due<today).length;
  document.getElementById('statPending').textContent = pending;
  document.getElementById('statDone').textContent = done;
  document.getElementById('statOverdue').textContent = overdue;
  document.getElementById('statRate').textContent = total ? Math.round(done/total*100)+'%' : '0%';
}

// ─── 操作 ──────────────────────────────────────────────────
function addTodo() {
  const text = document.getElementById('addText').value.trim();
  if (!text) return;
  const priority = document.getElementById('addPriority').value;
  const due = document.getElementById('addDue').value || null;
  const tagsStr = document.getElementById('addTags').value.trim();
  const tags = tagsStr ? tagsStr.split(/[,，]/).map(t=>t.trim()).filter(Boolean) : [];
  const todos = loadTodos();
  todos.push({
    id: nextId(todos),
    text, priority, status:'pending',
    created_at: new Date().toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}),
    completed_at: null, due, tags
  });
  saveTodos(todos);
  document.getElementById('addText').value = '';
  document.getElementById('addDue').value = '';
  document.getElementById('addTags').value = '';
  document.getElementById('addPriority').value = 'medium';
  render();
  showToast('✅ 已添加');
}

function toggleTodo(id) {
  const todos = loadTodos();
  const t = todos.find(t=>t.id===id);
  if (!t) return;
  t.status = t.status==='done'?'pending':'done';
  t.completed_at = t.status==='done' ? new Date().toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : null;
  saveTodos(todos);
  render();
}

function deleteTodo(id) {
  if (!confirm('确定删除此待办？')) return;
  const todos = loadTodos().filter(t=>t.id!==id);
  saveTodos(todos);
  render();
  showToast('🗑 已删除');
}

function clearDone() {
  const todos = loadTodos();
  const doneCount = todos.filter(t=>t.status==='done').length;
  if (!doneCount) { showToast('没有已完成的待办'); return; }
  if (!confirm(`确定清除 ${doneCount} 条已完成的待办？`)) return;
  saveTodos(todos.filter(t=>t.status!=='done'));
  render();
  showToast('🧹 已清除');
}

function openEdit(id) {
  editingId = id;
  const todos = loadTodos();
  const t = todos.find(t=>t.id===id);
  if (!t) return;
  document.getElementById('editText').value = t.text;
  document.getElementById('editPriority').value = t.priority || 'medium';
  document.getElementById('editDue').value = t.due || '';
  document.getElementById('editTags').value = (t.tags||[]).join(',');
  document.getElementById('editModal').classList.add('active');
}

function closeEdit() {
  document.getElementById('editModal').classList.remove('active');
  editingId = null;
}

function saveEdit() {
  if (!editingId) return;
  const text = document.getElementById('editText').value.trim();
  if (!text) return;
  const priority = document.getElementById('editPriority').value;
  const due = document.getElementById('editDue').value || null;
  const tagsStr = document.getElementById('editTags').value.trim();
  const tags = tagsStr ? tagsStr.split(/[,，]/).map(t=>t.trim()).filter(Boolean) : [];
  const todos = loadTodos();
  const t = todos.find(t=>t.id===editingId);
  if (t) { t.text=text; t.priority=priority; t.due=due; t.tags=tags; }
  saveTodos(todos);
  closeEdit();
  render();
  showToast('✏️ 已更新');
}

// ─── 导入导出 ──────────────────────────────────────────────
function exportData() {
  const todos = loadTodos();
  const blob = new Blob([JSON.stringify(todos,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `待办事项_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('📤 已导出');
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const data = JSON.parse(ev.target.result);
      if (!Array.isArray(data)) throw new Error();
      const todos = loadTodos();
      const maxId = todos.length ? Math.max(...todos.map(t=>t.id)) : 0;
      data.forEach((t,i) => {
        todos.push({...t, id: maxId + i + 1});
      });
      saveTodos(todos);
      render();
      showToast(`📥 已导入 ${data.length} 条`);
    } catch(err) {
      showToast('❌ 导入失败：文件格式错误');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

// ─── 同步码 ────────────────────────────────────────────────
function showSyncCode() {
  const todos = loadTodos();
  // 压缩为 base64 同步码
  const json = JSON.stringify(todos);
  const code = btoa(unescape(encodeURIComponent(json)));
  document.getElementById('syncExport').value = code;
  document.getElementById('syncImport').value = '';
  document.getElementById('syncModal').classList.add('active');
}

function closeSync() {
  document.getElementById('syncModal').classList.remove('active');
}

function copySyncCode() {
  const code = document.getElementById('syncExport').value;
  if (!code) return;
  navigator.clipboard.writeText(code).then(() => {
    showToast('✅ 同步码已复制');
  }).catch(() => {
    // fallback: 选中文本
    const el = document.getElementById('syncExport');
    el.select();
    document.execCommand('copy');
    showToast('✅ 同步码已复制');
  });
}

function importSyncCode(mode) {
  const code = document.getElementById('syncImport').value.trim();
  if (!code) { showToast('❌ 请粘贴同步码'); return; }
  try {
    const json = decodeURIComponent(escape(atob(code)));
    const data = JSON.parse(json);
    if (!Array.isArray(data)) throw new Error();
    if (mode === 'replace') {
      saveTodos(data);
      showToast(`📥 已替换，共 ${data.length} 条`);
    } else {
      // 合并：去重（按 text+priority+due 判断）
      const todos = loadTodos();
      const existingKeys = new Set(todos.map(t => t.text + '|' + t.priority + '|' + (t.due||'')));
      let added = 0;
      const maxId = todos.length ? Math.max(...todos.map(t=>t.id)) : 0;
      data.forEach((t, i) => {
        const key = t.text + '|' + t.priority + '|' + (t.due||'');
        if (!existingKeys.has(key)) {
          todos.push({...t, id: maxId + i + 1});
          existingKeys.add(key);
          added++;
        }
      });
      saveTodos(todos);
      showToast(`📥 已合并，新增 ${added} 条`);
    }
    render();
    closeSync();
  } catch(err) {
    showToast('❌ 同步码格式错误');
  }
}

// ─── 工具 ──────────────────────────────────────────────────
function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2000);
}

document.getElementById('editModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeEdit();
});
document.getElementById('syncModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeSync();
});

// 初始加载
render();
</script>
