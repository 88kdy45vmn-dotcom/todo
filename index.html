<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#667eea">
<title>待办事项</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#667eea;--primary-dark:#5a67d8;--primary-light:#eef0ff;
  --success:#48bb78;--success-light:#f0fff4;
  --danger:#fc8181;--danger-dark:#e53e3e;--danger-light:#fff5f5;
  --warning:#ed8936;--warning-light:#fffaf0;
  --bg:#f7f8fc;--card:#fff;--text:#2d3748;--text-light:#a0aec0;--border:#e2e8f0;
  --radius:14px;--shadow:0 2px 12px rgba(102,126,234,.08);
  --shadow-hover:0 4px 20px rgba(102,126,234,.15);
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
.container{max-width:640px;margin:0 auto;padding:20px 16px 100px}

/* 头部 */
header{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);margin:-20px -16px 0;padding:28px 20px 22px;border-radius:0 0 24px 24px;color:#fff;position:relative;overflow:hidden}
header::before{content:'';position:absolute;top:-50%;right:-30%;width:200px;height:200px;background:rgba(255,255,255,.08);border-radius:50%}
header::after{content:'';position:absolute;bottom:-40%;left:-20%;width:160px;height:160px;background:rgba(255,255,255,.06);border-radius:50%}
header h1{font-size:24px;font-weight:700;position:relative;z-index:1}
header .date-line{font-size:13px;opacity:.85;margin-top:4px;position:relative;z-index:1}
#syncStatus{font-size:11px;margin-top:6px;padding:3px 10px;border-radius:20px;display:inline-block;position:relative;z-index:1;background:rgba(255,255,255,.15);backdrop-filter:blur(4px)}

/* 统计 */
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}
.stat-card{background:var(--card);border-radius:12px;padding:12px 6px;text-align:center;box-shadow:var(--shadow);transition:transform .2s}
.stat-card:active{transform:scale(.97)}
.stat-card .num{font-size:24px;font-weight:800}
.stat-card .label{font-size:10px;color:var(--text-light);margin-top:2px;font-weight:500}
.stat-card.pending .num{color:#e53e3e}
.stat-card.done .num{color:#48bb78}
.stat-card.overdue .num{color:#ed8936}
.stat-card.rate .num{color:var(--primary)}

/* 进度条 */
.progress-bar{height:6px;background:var(--border);border-radius:3px;margin-bottom:16px;overflow:hidden}
.progress-bar .fill{height:100%;background:linear-gradient(90deg,#48bb78,#667eea);border-radius:3px;transition:width .5s ease}

/* 添加表单 */
.add-form{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.form-row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;align-items:center}
.form-row:last-child{margin-bottom:0}
.add-form input[type="text"],.add-form input[type="datetime-local"],.add-form select{
  padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;outline:none;transition:all .2s;background:#fafbff;min-height:42px
}
.add-form input:focus,.add-form select:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(102,126,234,.1)}
.add-form .text-input{flex:1;min-width:0}
.add-form select{min-width:0}
.add-form .datetime-input{flex:1;min-width:0}
.add-form .tags-input{width:100%;flex:1;min-width:0}
.add-form .row-label{font-size:12px;color:var(--text-light);white-space:nowrap;display:flex;align-items:center;gap:4px}

/* 工具栏 */
.toolbar{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.toolbar input,.toolbar select{padding:8px 10px;border:1.5px solid var(--border);border-radius:10px;font-size:13px;outline:none;background:var(--card);transition:border .2s}
.toolbar input:focus,.toolbar select:focus{border-color:var(--primary)}
.search-input{flex:1;min-width:120px}

/* 按钮 */
.btn{padding:8px 16px;border:none;border-radius:10px;font-size:13px;cursor:pointer;transition:all .15s;font-weight:600;-webkit-user-select:none;user-select:none;white-space:nowrap}
.btn:active{transform:scale(.95)}
.btn-primary{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;box-shadow:0 2px 8px rgba(102,126,234,.3)}
.btn-primary:hover{box-shadow:0 4px 12px rgba(102,126,234,.4)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:var(--danger-dark)}
.btn-ghost{background:transparent;color:var(--primary);border:1.5px solid var(--primary)}
.btn-ghost:hover{background:var(--primary);color:#fff}
.btn-sm{padding:5px 10px;font-size:11px;border-radius:8px}

/* 待办列表 */
.todo-list{display:flex;flex-direction:column;gap:8px}
.todo-item{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);display:flex;align-items:flex-start;gap:10px;transition:all .2s;border-left:4px solid transparent}
.todo-item:hover{box-shadow:var(--shadow-hover)}
.todo-item.priority-high{border-left-color:#e53e3e}
.todo-item.priority-medium{border-left-color:var(--warning)}
.todo-item.priority-low{border-left-color:#48bb78}
.todo-item.done{opacity:.55}
.todo-item.done .todo-text{text-decoration:line-through;color:var(--text-light)}

.checkbox{width:22px;height:22px;border-radius:7px;border:2px solid #cbd5e0;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;margin-top:2px}
.checkbox:active{transform:scale(.85)}
.checkbox.checked{background:var(--success);border-color:var(--success)}
.checkbox.checked::after{content:"✓";color:#fff;font-size:12px;font-weight:800}

.todo-body{flex:1;min-width:0}
.todo-text{font-size:15px;word-break:break-word;line-height:1.5;font-weight:500}
.todo-meta{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap;align-items:center}
.badge{font-size:10px;padding:2px 8px;border-radius:6px;font-weight:600;white-space:nowrap;letter-spacing:.3px}
.badge-high{background:#fff5f5;color:#e53e3e}
.badge-medium{background:var(--warning-light);color:#c05621}
.badge-low{background:var(--success-light);color:#276749}
.badge-due{background:var(--primary-light);color:var(--primary)}
.badge-overdue{background:#e53e3e;color:#fff;animation:pulse 2s infinite}
.badge-reminder{background:#fffbeb;color:#b7791f}
.badge-tag{background:#ebf8ff;color:#3182ce}
.todo-time{font-size:10px;color:var(--text-light)}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}

.todo-actions{display:flex;gap:4px;flex-shrink:0}

.empty-state{text-align:center;padding:48px 20px;color:var(--text-light)}
.empty-state .icon{font-size:52px;margin-bottom:12px;filter:grayscale(.2)}
.empty-state .desc{font-size:14px}

/* 编辑模态框 */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:100;padding:0;backdrop-filter:blur(2px)}
.modal-overlay.active{display:flex}
.modal{background:var(--card);border-radius:20px 20px 0;padding:24px 20px 32px;width:100%;max-width:480px;box-shadow:0 -4px 24px rgba(0,0,0,.12);max-height:85vh;overflow-y:auto;animation:slideUp .25s ease}
.modal h3{margin-bottom:16px;font-size:18px;font-weight:700}
.modal .field{margin-bottom:12px}
.modal label{display:block;font-size:12px;color:var(--text-light);margin-bottom:4px;font-weight:600}
.modal input,.modal select,.modal textarea{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;outline:none;background:#fafbff;min-height:42px}
.modal input:focus,.modal select:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(102,126,234,.1)}
.modal .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.modal .modal-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

/* toast */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--text);color:#fff;padding:10px 24px;border-radius:24px;font-size:13px;z-index:200;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;font-weight:500;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 数据管理栏 */
.data-bar{display:flex;gap:6px;margin-top:20px;justify-content:center;flex-wrap:wrap}
.data-bar .btn{font-size:11px;padding:6px 12px;background:var(--card);color:var(--text-light);border:1.5px solid var(--border);border-radius:10px}
.data-bar .btn:active{background:var(--primary-light);color:var(--primary);border-color:var(--primary)}

/* 云同步提示横幅 */
.sync-banner{background:var(--primary-light);border:1.5px dashed var(--primary);border-radius:12px;padding:12px 16px;margin-bottom:14px;text-align:center;font-size:13px;color:var(--primary);cursor:pointer;transition:all .2s}
.sync-banner:active{transform:scale(.98)}
.sync-banner strong{font-weight:700}

/* 移动端适配 */
@media(max-width:600px){
  .container{padding:12px 10px 90px}
  header{margin:-12px -10px 0;padding:22px 16px 18px;border-radius:0 0 20px 20px}
  header h1{font-size:20px}
  .stats-bar{gap:6px}
  .stat-card{padding:10px 4px;border-radius:10px}
  .stat-card .num{font-size:20px}
  .stat-card .label{font-size:9px}
  .add-form{padding:12px;border-radius:12px}
  .form-row{gap:6px}
  .add-form input[type="text"],.add-form input[type="datetime-local"],.add-form select{
    width:100%;font-size:16px;border-radius:8px
  }
  .add-form .text-input{width:100%}
  .add-form .datetime-input{width:100%}
  .add-form .tags-input{width:100%}
  .add-form select{width:100%}
  .form-row-datetime{flex-direction:column;gap:6px}
  .form-row-datetime .row-label{display:none}
  .toolbar{gap:5px}
  .toolbar input,.toolbar select{padding:7px 8px;font-size:13px;border-radius:8px}
  .search-input{flex-basis:100%;order:-1}
  .btn{padding:7px 12px;font-size:12px;border-radius:8px}
  .todo-item{padding:12px;gap:8px;border-radius:12px}
  .todo-text{font-size:14px}
  .todo-meta{gap:4px}
  .badge{font-size:9px;padding:1px 6px}
  .todo-time{font-size:9px}
  .todo-actions{flex-direction:row;width:100%;justify-content:flex-end;gap:6px;margin-top:6px}
  .todo-actions .btn{padding:5px 10px;font-size:11px}
  .checkbox{width:20px;height:20px}
  .modal{padding:20px 16px 28px;border-radius:16px 16px 0;width:100%;max-height:90vh}
  .modal h3{font-size:16px}
  .toast{top:12px;font-size:12px;padding:8px 18px}
  .data-bar .btn{font-size:10px;padding:5px 10px}
  .sync-banner{font-size:12px;padding:10px 12px}
}

/* 桌面端模态框居中 */
@media(min-width:601px){
  .modal-overlay{align-items:center;padding:16px}
  .modal{border-radius:20px;max-height:80vh}
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>📋 待办事项</h1>
    <div class="date-line" id="dateDisplay"></div>
    <div id="syncStatus"></div>
  </header>

  <div id="syncBanner" class="sync-banner" onclick="showCloudSetting()" style="display:none">
    <strong>☁️ 开启云同步</strong> — 多设备自动同步待办数据，点击设置
  </div>

  <div class="stats-bar">
    <div class="stat-card pending"><div class="num" id="statPending">0</div><div class="label">待办</div></div>
    <div class="stat-card done"><div class="num" id="statDone">0</div><div class="label">完成</div></div>
    <div class="stat-card overdue"><div class="num" id="statOverdue">0</div><div class="label">逾期</div></div>
    <div class="stat-card rate"><div class="num" id="statRate">0%</div><div class="label">完成率</div></div>
  </div>

  <div class="progress-bar"><div class="fill" id="progressFill" style="width:0%"></div></div>

  <div class="add-form">
    <div class="form-row">
      <input type="text" id="addText" class="text-input" placeholder="输入待办内容，回车添加..." autofocus>
    </div>
    <div class="form-row">
      <select id="addPriority" style="flex:1;min-width:0">
        <option value="medium">🟡 中优先级</option>
        <option value="high">🔴 高优先级</option>
        <option value="low">🟢 低优先级</option>
      </select>
      <input type="datetime-local" id="addDue" class="datetime-input" title="截止时间">
    </div>
    <div class="form-row">
      <input type="datetime-local" id="addReminder" class="datetime-input" title="提醒时间">
      <span class="row-label">⏰ 提醒</span>
    </div>
    <div class="form-row">
      <input type="text" id="addTags" class="tags-input" placeholder="🏷 标签(逗号分隔)">
    </div>
    <div class="form-row" style="justify-content:flex-end">
      <button class="btn btn-primary" onclick="addTodo()">➕ 添加</button>
    </div>
  </div>

  <div class="toolbar">
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 搜索..." oninput="render()">
    <select id="filterStatus" onchange="render()">
      <option value="all">全部</option>
      <option value="pending">待办</option>
      <option value="done">已完成</option>
    </select>
    <select id="sortBy" onchange="render()">
      <option value="priority">按优先级</option>
      <option value="due">按截止时间</option>
      <option value="created">按创建时间</option>
    </select>
    <button class="btn btn-danger btn-sm" onclick="clearDone()">🗑 清除</button>
  </div>

  <div class="todo-list" id="todoList"></div>

  <div class="data-bar">
    <button class="btn" onclick="exportData()">📤 导出</button>
    <button class="btn" onclick="document.getElementById('importFile').click()">📥 导入</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
    <button class="btn" onclick="showSyncCode()">🔄 同步码</button>
    <button class="btn" onclick="showCloudSetting()">☁️ 云同步</button>
  </div>
</div>

<!-- 编辑模态框 -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3>✏️ 编辑待办</h3>
    <div class="field"><label>内容</label><input type="text" id="editText"></div>
    <div class="field"><label>优先级</label>
      <select id="editPriority">
        <option value="high">🔴 高</option>
        <option value="medium">🟡 中</option>
        <option value="low">🟢 低</option>
      </select>
    </div>
    <div class="field"><label>📅 截止时间</label><input type="datetime-local" id="editDue"></div>
    <div class="field"><label>⏰ 提醒时间</label><input type="datetime-local" id="editReminder"></div>
    <div class="field"><label>🏷 标签 (逗号分隔)</label><input type="text" id="editTags"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeEdit()">取消</button>
      <button class="btn btn-primary" onclick="saveEdit()">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- 同步码模态框 -->
<div class="modal-overlay" id="syncModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3>🔄 跨设备同步</h3>
    <p style="font-size:13px;color:var(--text-light);margin-bottom:12px">复制同步码到另一设备粘贴，即可同步数据</p>
    <div class="field">
      <label>📤 导出同步码</label>
      <textarea id="syncExport" readonly style="width:100%;height:80px;padding:8px;border:1.5px solid var(--border);border-radius:10px;font-size:12px;font-family:monospace;resize:none;background:#fafbff"></textarea>
      <button class="btn btn-primary" style="margin-top:6px;width:100%" onclick="copySyncCode()">复制同步码</button>
    </div>
    <div style="text-align:center;color:var(--text-light);margin:10px 0;font-size:12px">─── 或 ───</div>
    <div class="field">
      <label>📥 导入同步码</label>
      <textarea id="syncImport" placeholder="粘贴同步码..." style="width:100%;height:80px;padding:8px;border:1.5px solid var(--border);border-radius:10px;font-size:12px;font-family:monospace;resize:none;background:#fafbff"></textarea>
      <div style="display:flex;gap:6px;margin-top:6px">
        <button class="btn btn-primary" style="flex:1" onclick="importSyncCode('merge')">合并导入</button>
        <button class="btn btn-danger" style="flex:1" onclick="importSyncCode('replace')">替换导入</button>
      </div>
      <p style="font-size:11px;color:var(--text-light);margin-top:4px">合并=保留本地+添加新 | 替换=清空本地并覆盖</p>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeSync()">关闭</button>
    </div>
  </div>
</div>

<!-- 云同步设置模态框 -->
<div class="modal-overlay" id="cloudModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3>☁️ 云同步设置</h3>
    <p style="font-size:13px;color:var(--text-light);margin-bottom:14px">通过 GitHub API 实现多设备自动同步，设置一次即可</p>
    <div class="field">
      <label>GitHub 仓库</label>
      <input type="text" id="cloudRepo" placeholder="例如: 88kdy45vmn-dotcom/todo">
      <p style="font-size:11px;color:var(--text-light);margin-top:4px">你的 GitHub 用户名/仓库名</p>
    </div>
    <div class="field">
      <label>Personal Access Token</label>
      <input type="password" id="cloudToken" placeholder="ghp_xxxxxxxxxxxx">
      <p style="font-size:11px;color:var(--text-light);margin-top:4px">需要 repo 权限 · <a href="https://github.com/settings/tokens/new" target="_blank" style="color:var(--primary)">去创建 →</a></p>
    </div>
    <div class="field">
      <label>分支 (默认 main)</label>
      <input type="text" id="cloudBranch" placeholder="main" value="main">
    </div>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="btn btn-primary" style="flex:1" onclick="saveCloudSetting()">保存并测试</button>
      <button class="btn btn-danger" style="flex:1" onclick="clearCloudSetting()">清除</button>
    </div>
    <div id="cloudTestResult" style="margin-top:10px;font-size:13px;text-align:center;font-weight:500"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeCloudSetting()">关闭</button>
    </div>
  </div>
</div>

<script>
// ─── 云同步（GitHub API）──────────────────────────────────
const SYNC_INTERVAL = 30;
const CLOUD_KEY_REPO = 'cloud_repo';
const CLOUD_KEY_TOKEN = 'cloud_token';
const CLOUD_KEY_BRANCH = 'cloud_branch';
const CLOUD_KEY_SHA = 'cloud_sha';
const CLOUD_KEY_SYNCED = 'cloud_last_sync';
const CLOUD_DATA_PATH = 'data.json';

let cloudRepo = localStorage.getItem(CLOUD_KEY_REPO) || '';
let cloudToken = localStorage.getItem(CLOUD_KEY_TOKEN) || '';
let cloudBranch = localStorage.getItem(CLOUD_KEY_BRANCH) || 'main';
let cloudSha = localStorage.getItem(CLOUD_KEY_SHA) || '';
let cloudOnline = false;
let syncTimer = null;
let syncing = false;

async function githubApi(method, body) {
  const url = `https://api.github.com/repos/${cloudRepo}/contents/${CLOUD_DATA_PATH}`;
  const headers = {
    'Authorization': `token ${cloudToken}`,
    'Accept': 'application/vnd.github.v3+json',
    'Content-Type': 'application/json',
  };
  const opts = { method, headers };
  if (body) opts.body = JSON.stringify(body);
  const suffix = method === 'GET' ? `?ref=${cloudBranch}` : '';
  const resp = await fetch(url + suffix, opts);
  return resp;
}

async function cloudPull() {
  try {
    const resp = await githubApi('GET', null);
    if (!resp.ok) return null;
    const data = await resp.json();
    cloudSha = data.sha;
    localStorage.setItem(CLOUD_KEY_SHA, cloudSha);
    const content = atob(data.content.replace(/\n/g, ''));
    return JSON.parse(content);
  } catch(e) { return null; }
}

async function cloudPush(todos) {
  try {
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(todos))));
    const body = {
      message: `sync ${new Date().toISOString().slice(0,16)}`,
      content, branch: cloudBranch,
    };
    if (cloudSha) body.sha = cloudSha;
    let resp = await githubApi('PUT', body);
    if (resp.status === 409 && cloudSha) {
      const pullResp = await githubApi('GET', null);
      if (pullResp.ok) {
        const pd = await pullResp.json();
        cloudSha = pd.sha;
        localStorage.setItem(CLOUD_KEY_SHA, cloudSha);
        body.sha = cloudSha;
        resp = await githubApi('PUT', body);
      }
    }
    if (!resp.ok) return false;
    const result = await resp.json();
    cloudSha = result.content.sha;
    localStorage.setItem(CLOUD_KEY_SHA, cloudSha);
    return true;
  } catch(e) { return false; }
}

function mergeTodos(local, remote) {
  const map = {};
  local.forEach(t => { map[t.id] = {...t}; });
  remote.forEach(t => {
    if (!map[t.id]) {
      map[t.id] = {...t};
    } else {
      const ex = map[t.id];
      if (t.status === 'done' && ex.status !== 'done') {
        map[t.id] = {...t};
      } else if (t.completed_at && !ex.completed_at) {
        map[t.id] = {...t};
      }
    }
  });
  return Object.values(map).sort((a,b) => a.id - b.id);
}

async function autoSync() {
  if (!cloudRepo || !cloudToken) {
    if (cloudOnline) { cloudOnline = false; updateSyncStatus(); }
    return;
  }
  if (syncing) return;
  syncing = true;
  try {
    const localTodos = loadTodos();
    const remoteData = await cloudPull();
    if (remoteData === null) {
      if (!cloudSha) {
        const ok = await cloudPush(localTodos);
        cloudOnline = ok;
        if (ok) localStorage.setItem(CLOUD_KEY_SYNCED, new Date().toISOString());
      } else {
        cloudOnline = false;
      }
      updateSyncStatus();
      return;
    }
    cloudOnline = true;
    const merged = mergeTodos(localTodos, remoteData);
    const localStr = JSON.stringify(localTodos.sort((a,b)=>a.id-b.id));
    const mergedStr = JSON.stringify(merged.sort((a,b)=>a.id-b.id));
    if (localStr !== mergedStr) {
      saveTodos(merged);
      render();
    }
    await cloudPush(merged);
    localStorage.setItem(CLOUD_KEY_SYNCED, new Date().toISOString());
    updateSyncStatus();
  } catch(e) {
    cloudOnline = false;
    updateSyncStatus();
  } finally {
    syncing = false;
  }
}

function updateSyncStatus() {
  const el = document.getElementById('syncStatus');
  const banner = document.getElementById('syncBanner');
  if (!el) return;
  const lastSync = localStorage.getItem(CLOUD_KEY_SYNCED);
  if (cloudOnline) {
    el.textContent = '🟢 云端已连接 · 自动同步中';
    el.style.background = 'rgba(72,187,120,.2)';
    banner.style.display = 'none';
  } else if (cloudRepo && cloudToken) {
    el.textContent = '🔴 云端离线 · 数据保存在本地';
    el.style.background = 'rgba(252,129,129,.2)';
    banner.style.display = 'none';
  } else {
    el.textContent = '⚫ 纯本地模式';
    el.style.background = 'rgba(255,255,255,.15)';
    banner.style.display = 'block';
  }
  if (lastSync && cloudOnline) {
    const t = new Date(lastSync);
    el.textContent += ` · ${t.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}`;
  }
}

function showCloudSetting() {
  document.getElementById('cloudRepo').value = cloudRepo;
  document.getElementById('cloudToken').value = cloudToken;
  document.getElementById('cloudBranch').value = cloudBranch;
  document.getElementById('cloudTestResult').textContent = '';
  document.getElementById('cloudModal').classList.add('active');
}

function closeCloudSetting() {
  document.getElementById('cloudModal').classList.remove('active');
}

function saveCloudSetting() {
  const repo = document.getElementById('cloudRepo').value.trim();
  const token = document.getElementById('cloudToken').value.trim();
  const branch = document.getElementById('cloudBranch').value.trim() || 'main';
  if (!repo || !token) { showToast('❌ 请填写仓库和 Token'); return; }
  cloudRepo = repo; cloudToken = token; cloudBranch = branch;
  cloudSha = '';
  localStorage.setItem(CLOUD_KEY_REPO, repo);
  localStorage.setItem(CLOUD_KEY_TOKEN, token);
  localStorage.setItem(CLOUD_KEY_BRANCH, branch);
  localStorage.removeItem(CLOUD_KEY_SHA);
  document.getElementById('cloudTestResult').textContent = '⏳ 正在测试连接...';
  document.getElementById('cloudTestResult').style.color = 'var(--primary)';
  autoSync().then(() => {
    const el = document.getElementById('cloudTestResult');
    if (cloudOnline) {
      el.textContent = '✅ 连接成功！自动同步已开启';
      el.style.color = 'var(--success)';
    } else {
      el.textContent = '❌ 连接失败，请检查仓库和 Token';
      el.style.color = 'var(--danger-dark)';
    }
  });
}

function clearCloudSetting() {
  cloudRepo = ''; cloudToken = ''; cloudBranch = 'main'; cloudSha = '';
  localStorage.removeItem(CLOUD_KEY_REPO);
  localStorage.removeItem(CLOUD_KEY_TOKEN);
  localStorage.removeItem(CLOUD_KEY_BRANCH);
  localStorage.removeItem(CLOUD_KEY_SHA);
  document.getElementById('cloudRepo').value = '';
  document.getElementById('cloudToken').value = '';
  document.getElementById('cloudBranch').value = 'main';
  document.getElementById('cloudTestResult').textContent = '';
  cloudOnline = false;
  updateSyncStatus();
  showToast('✅ 已清除云同步设置');
}

function startAutoSync() {
  updateSyncStatus();
  if (cloudRepo && cloudToken) autoSync();
  syncTimer = setInterval(() => {
    if (cloudRepo && cloudToken) autoSync();
  }, SYNC_INTERVAL * 1000);
}

// ┄── 数据层（localStorage）─────────────────────────────────
const STORAGE_KEY = 'todo_app_data';
const PRIORITY_MAP = {'高':'high','中':'medium','低':'low','high':'high','medium':'medium','low':'low'};
const PRIORITY_ORDER = {high:0,medium:1,low:2};
const PRIORITY_LABEL = {high:'🔴 高',medium:'🟡 中',low:'🟢 低'};

function loadTodos() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch(e) { return []; }
}

function saveTodos(todos) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
}

function nextId(todos) {
  return todos.length ? Math.max(...todos.map(t=>t.id)) + 1 : 1;
}

// ─── 渲染 ──────────────────────────────────────────────────
let editingId = null;

document.getElementById('dateDisplay').textContent =
  new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});

document.getElementById('addText').addEventListener('keydown', e => { if(e.key==='Enter') addTodo(); });

function render() {
  const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
  const status = document.getElementById('filterStatus').value;
  const sort = document.getElementById('sortBy').value;

  let todos = loadTodos();
  if (status !== 'all') todos = todos.filter(t => t.status === status);
  if (keyword) todos = todos.filter(t => t.text.toLowerCase().includes(keyword));

  if (sort === 'priority') todos.sort((a,b) => (PRIORITY_ORDER[a.priority]||1) - (PRIORITY_ORDER[b.priority]||1) || a.id - b.id);
  else if (sort === 'due') todos.sort((a,b) => (a.due||'9999') < (b.due||'9999') ? -1 : 1);
  else if (sort === 'created') todos.sort((a,b) => b.created_at > a.created_at ? 1 : -1);

  const list = document.getElementById('todoList');
  if (!todos.length) {
    list.innerHTML = '<div class="empty-state"><div class="icon">🎉</div><div class="desc">暂无待办事项</div></div>';
  } else {
    const today = new Date().toISOString().slice(0,10);
    list.innerHTML = todos.map(t => {
      const isOverdue = t.status==='pending' && t.due && t.due.slice(0,10) < today;
      const pc = t.priority || 'medium';
      const dueDisplay = t.due ? formatDateTime(t.due) : '';
      const reminderDisplay = t.reminder ? formatDateTime(t.reminder) : '';
      return `
      <div class="todo-item priority-${pc} ${t.status==='done'?'done':''}" data-id="${t.id}">
        <div class="checkbox ${t.status==='done'?'checked':''}" onclick="toggleTodo(${t.id})"></div>
        <div class="todo-body">
          <div class="todo-text">${esc(t.text)}</div>
          <div class="todo-meta">
            <span class="badge badge-${pc}">${PRIORITY_LABEL[pc]||'🟡 中'}</span>
            ${t.due?`<span class="badge ${isOverdue?'badge-overdue':'badge-due'}">📅 ${dueDisplay}${isOverdue?' ⚠️':''}</span>`:''}
            ${t.reminder?`<span class="badge badge-reminder">⏰ ${reminderDisplay}</span>`:''}
            ${(t.tags||[]).map(tag=>`<span class="badge badge-tag">#${esc(tag)}</span>`).join('')}
            <span class="todo-time">${t.status==='done'&&t.completed_at?'完成于 '+t.completed_at:t.created_at}</span>
          </div>
        </div>
        <div class="todo-actions">
          <button class="btn btn-ghost btn-sm" onclick="openEdit(${t.id})">编辑</button>
          <button class="btn btn-danger btn-sm" onclick="deleteTodo(${t.id})">删除</button>
        </div>
      </div>`;
    }).join('');
  }
  updateStats();
}

function formatDateTime(dt) {
  if (!dt) return '';
  // "2026/09/24 18:00" -> "9/24 18:00"
  const parts = dt.replace('T', ' ').split(' ');
  const datePart = parts[0];
  const timePart = parts[1] || '';
  // 去掉秒
  const shortTime = timePart.replace(/:\d{2}$/, '');
  // 简化日期
  const dateParts = datePart.split(/[\/\-]/);
  if (dateParts.length === 3) {
    const m = parseInt(dateParts[1]);
    const d = parseInt(dateParts[2]);
    return `${m}/${d} ${shortTime}`;
  }
  return `${datePart} ${shortTime}`;
}

function updateStats() {
  const todos = loadTodos();
  const today = new Date().toISOString().slice(0,10);
  const total = todos.length;
  const pending = todos.filter(t=>t.status==='pending').length;
  const done = todos.filter(t=>t.status==='done').length;
  const overdue = todos.filter(t=>t.status==='pending'&&t.due&&t.due.slice(0,10)<today).length;
  const rate = total ? Math.round(done/total*100) : 0;
  document.getElementById('statPending').textContent = pending;
  document.getElementById('statDone').textContent = done;
  document.getElementById('statOverdue').textContent = overdue;
  document.getElementById('statRate').textContent = rate + '%';
  document.getElementById('progressFill').style.width = rate + '%';
}

// ─── 操作 ──────────────────────────────────────────────────
function addTodo() {
  const text = document.getElementById('addText').value.trim();
  if (!text) return;
  const priority = document.getElementById('addPriority').value;
  const dueRaw = document.getElementById('addDue').value || null;
  const due = dueRaw ? dueRaw.replace('T', ' ') : null;
  const reminderRaw = document.getElementById('addReminder').value || null;
  const reminder = reminderRaw ? reminderRaw.replace('T', ' ') : null;
  const tagsStr = document.getElementById('addTags').value.trim();
  const tags = tagsStr ? tagsStr.split(/[,，]/).map(t=>t.trim()).filter(Boolean) : [];
  const todos = loadTodos();
  todos.push({
    id: nextId(todos),
    text, priority, status:'pending',
    created_at: new Date().toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}),
    completed_at: null, due, reminder, tags, reminded: false
  });
  saveTodos(todos);
  document.getElementById('addText').value = '';
  document.getElementById('addDue').value = '';
  document.getElementById('addReminder').value = '';
  document.getElementById('addTags').value = '';
  document.getElementById('addPriority').value = 'medium';
  render();
  showToast('✅ 已添加');
  requestNotificationPermission();
}

function toggleTodo(id) {
  const todos = loadTodos();
  const t = todos.find(t=>t.id===id);
  if (!t) return;
  t.status = t.status==='done'?'pending':'done';
  t.completed_at = t.status==='done' ? new Date().toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : null;
  saveTodos(todos);
  render();
}

function deleteTodo(id) {
  if (!confirm('确定删除此待办？')) return;
  const todos = loadTodos().filter(t=>t.id!==id);
  saveTodos(todos);
  render();
  showToast('🗑 已删除');
}

function clearDone() {
  const todos = loadTodos();
  const doneCount = todos.filter(t=>t.status==='done').length;
  if (!doneCount) { showToast('没有已完成的待办'); return; }
  if (!confirm(`确定清除 ${doneCount} 条已完成的待办？`)) return;
  saveTodos(todos.filter(t=>t.status!=='done'));
  render();
  showToast('🧹 已清除');
}

function openEdit(id) {
  editingId = id;
  const todos = loadTodos();
  const t = todos.find(t=>t.id===id);
  if (!t) return;
  document.getElementById('editText').value = t.text;
  document.getElementById('editPriority').value = t.priority || 'medium';
  document.getElementById('editDue').value = (t.due || '').replace(' ', 'T');
  document.getElementById('editReminder').value = (t.reminder || '').replace(' ', 'T');
  document.getElementById('editTags').value = (t.tags||[]).join(',');
  document.getElementById('editModal').classList.add('active');
}

function closeEdit() {
  document.getElementById('editModal').classList.remove('active');
  editingId = null;
}

function saveEdit() {
  if (!editingId) return;
  const text = document.getElementById('editText').value.trim();
  if (!text) return;
  const priority = document.getElementById('editPriority').value;
  const dueRaw = document.getElementById('editDue').value || null;
  const due = dueRaw ? dueRaw.replace('T', ' ') : null;
  const reminderRaw = document.getElementById('editReminder').value || null;
  const reminder = reminderRaw ? reminderRaw.replace('T', ' ') : null;
  const tagsStr = document.getElementById('editTags').value.trim();
  const tags = tagsStr ? tagsStr.split(/[,，]/).map(t=>t.trim()).filter(Boolean) : [];
  const todos = loadTodos();
  const t = todos.find(t=>t.id===editingId);
  if (t) { t.text=text; t.priority=priority; t.due=due; t.reminder=reminder; t.tags=tags; if(reminder) t.reminded=false; }
  saveTodos(todos);
  closeEdit();
  render();
  showToast('✏️ 已更新');
}

// ─── 导入导出 ──────────────────────────────────────────────
function exportData() {
  const todos = loadTodos();
  const blob = new Blob([JSON.stringify(todos,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `待办事项_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('📤 已导出');
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const data = JSON.parse(ev.target.result);
      if (!Array.isArray(data)) throw new Error();
      const todos = loadTodos();
      const maxId = todos.length ? Math.max(...todos.map(t=>t.id)) : 0;
      data.forEach((t,i) => {
        todos.push({...t, id: maxId + i + 1});
      });
      saveTodos(todos);
      render();
      showToast(`📥 已导入 ${data.length} 条`);
    } catch(err) {
      showToast('❌ 导入失败：文件格式错误');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

// ─── 同步码 ────────────────────────────────────────────────
function showSyncCode() {
  const todos = loadTodos();
  const json = JSON.stringify(todos);
  const code = btoa(unescape(encodeURIComponent(json)));
  document.getElementById('syncExport').value = code;
  document.getElementById('syncImport').value = '';
  document.getElementById('syncModal').classList.add('active');
}

function closeSync() {
  document.getElementById('syncModal').classList.remove('active');
}

function copySyncCode() {
  const code = document.getElementById('syncExport').value;
  if (!code) return;
  navigator.clipboard.writeText(code).then(() => {
    showToast('✅ 同步码已复制');
  }).catch(() => {
    const el = document.getElementById('syncExport');
    el.select();
    document.execCommand('copy');
    showToast('✅ 同步码已复制');
  });
}

function importSyncCode(mode) {
  const code = document.getElementById('syncImport').value.trim();
  if (!code) { showToast('❌ 请粘贴同步码'); return; }
  try {
    const json = decodeURIComponent(escape(atob(code)));
    const data = JSON.parse(json);
    if (!Array.isArray(data)) throw new Error();
    if (mode === 'replace') {
      saveTodos(data);
      showToast(`📥 已替换，共 ${data.length} 条`);
    } else {
      const todos = loadTodos();
      const existingKeys = new Set(todos.map(t => t.text + '|' + t.priority + '|' + (t.due||'')));
      let added = 0;
      const maxId = todos.length ? Math.max(...todos.map(t=>t.id)) : 0;
      data.forEach((t, i) => {
        const key = t.text + '|' + t.priority + '|' + (t.due||'');
        if (!existingKeys.has(key)) {
          todos.push({...t, id: maxId + i + 1});
          existingKeys.add(key);
          added++;
        }
      });
      saveTodos(todos);
      showToast(`📥 已合并，新增 ${added} 条`);
    }
    render();
    closeSync();
  } catch(err) {
    showToast('❌ 同步码格式错误');
  }
}

// ─── 工具 ──────────────────────────────────────────────────
function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2000);
}

document.getElementById('editModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeEdit();
});
document.getElementById('syncModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeSync();
});
document.getElementById('cloudModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeCloudSetting();
});

// 初始加载
render();
startAutoSync();
startReminderCheck();

// ─── 提醒通知系统 ──────────────────────────────────────────
function requestNotificationPermission() {
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
}

function startReminderCheck() {
  setInterval(checkReminders, 30000);
  checkReminders();
}

function checkReminders() {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const todos = loadTodos();
  const now = new Date();
  let changed = false;
  todos.forEach(t => {
    if (t.status !== 'pending' || !t.reminder || t.reminded) return;
    const reminderTime = new Date(t.reminder.replace(' ', 'T'));
    if (isNaN(reminderTime.getTime())) return;
    const diff = now - reminderTime;
    if (diff >= 0 && diff < 5 * 60 * 1000) {
      t.reminded = true;
      changed = true;
      const dueInfo = t.due ? `，截止：${t.due}` : '';
      new Notification('⏰ 待办提醒', {
        body: `${t.text}${dueInfo}`,
        icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">📋</text></svg>',
        tag: `todo-reminder-${t.id}`,
      });
    }
  });
  if (changed) {
    saveTodos(todos);
    render();
  }
}
